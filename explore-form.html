<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Explore Form</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link rel="stylesheet" href="from.css">
        <style>
        /* TEMP fix inline for testing */
        .hero-section {
            position: relative;
            height: 100vh;
            background: url('./Asset/Sky.jpg') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 0;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .brand-name {
            color: #00c9a7;
            font-style: italic;
            font-size: 2.5rem;
        }

        .search-bar input,
        .search-bar button {
            width: 270px;
            border-radius: 25px;
            padding: 10px 20px;
            margin: 5px;
            font-size: 15px;
        }

        input::placeholder {
            font-size: 14px;
        }
    </style>
    </head>
    <body>
        <section id="home" class="hero-section">
            <div class="hero-content container">
                <h1 class="display-5 fw-bold">
                    Start Your Journey with <span
                        class="brand-name">TravelVibe</span>
                </h1>
                <p class="lead">Plan your next adventure effortlessly</p>

                <form id="search"
                    class="search-bar d-flex flex-wrap justify-content-center mt-4">
                    <input list="countries" name="destination"
                        class="form-control" placeholder="Destinations" />
                    <datalist id="countries">
                        <option value="Argentina">
                            <option value="Australia">
                                <option value="Brazil">
                                    <option value="Canada">
                                        <option value="Denmark">
                                            <option value="Egypt">
                                                <option value="France">
                                                    <option value="Germany">
                                                        <option value="Hungary">
                                                            <option
                                                                value="India">
                                                                <option
                                                                    value="Japan">
                                                                    <option
                                                                        value="Kenya">
                                                                        <option
                                                                            value="Mexico">
                                                                            <option
                                                                                value="Nepal">
                                                                                <option
                                                                                    value="Oman">
                                                                                    <option
                                                                                        value="Peru">
                                                                                        <option
                                                                                            value="Qatar">
                                                                                            <option
                                                                                                value="Russia">
                                                                                                <option
                                                                                                    value="Spain">
                                                                                                    <option
                                                                                                        value="Turkey">
                                                                                                        <option
                                                                                                            value="USA">
                                                                                                            <option
                                                                                                                value="Vietnam">
                                                                                                                <option
                                                                                                                    value="Zimbabwe">
                                                                                                                </datalist>

                                                                                                                <input
                                                                                                                    type="date"
                                                                                                                    class="form-control"
                                                                                                                    placeholder="dd-mm-yyyy" />
                                                                                                                <input
                                                                                                                    type="number"
                                                                                                                    class="form-control"
                                                                                                                    placeholder="Travelers"
                                                                                                                    min="1" />
                                                                                                                <button
                                                                                                                    type="submit"
                                                                                                                    class="btn btn-primary px-4">Search</button>
                                                                                                            </form>
                                                                                                        </div>
                                                                                                    </section>

                                                                                                    <script
                                                                                                        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
                                                                                                </body>
                                                                                            </html>

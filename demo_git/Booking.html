    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
         
      background: url('flight.jpeg') no-repeat center center/cover;
      position: relative;
      overflow: hidden;
    
    }
    /* Overlay to darken background image */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: -1;
    }

   /* Fullscreen carousel fixed above static bg */
    #bg-carousel {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2; /* above static bg but behind overlay and form */
      pointer-events: none; /* so it doesn't block clicks */
    }
    
    #bg-carousel .carousel-item {
      height: 100vh;
      background-size: cover;
      background-position: center;
    }
    
    /* Dark overlay on top of carousel & static bg */
    #bg-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.6);
      z-index: -1;
      pointer-events: none;
    }
    
    /* Your form container */
    .form-container {
      background: linear-gradient(
        135deg,
        rgba(25, 40, 70, 0.9),
        rgba(135, 206, 250, 0.85)
      );
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 10; /* on top of all backgrounds */
    }
    /* Slight fade-in and scale effect for visible step */
    .form-container:not(.hidden) {
      opacity: 1;
      transform: scale(1);
      z-index: 10;
      position: relative;
    }
    /* Hidden steps fade out and scale down */
    .form-container.hidden {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
      position: absolute;
    }

    input, select, input[list] {
      width: 100%;
      padding: 12px 14px;
      margin: 12px 0;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
      outline-offset: 2px;
      transition: box-shadow 0.3s ease;
    }
    /* Input focus highlight */
    input:focus, select:focus, input[list]:focus {
      box-shadow: 0 0 6px 2px #e91e63;
      outline: none;
      background-color: #222;
      color: white;
    }

    button {
      background: #e91e63;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 12px;
      font-weight: 600;
      font-size: 1rem;
      transition: background-color 0.3s ease, transform 0.15s ease;
      user-select: none;
      box-shadow: 0 4px 8px rgb(233 30 99 / 0.6);
    }
    /* Hover effect for buttons */
    button:hover {
      background-color: #c2185b;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgb(194 24 91 / 0.8);
    }
    /* Active button press effect */
    button:active {
      transform: translateY(0);
      box-shadow: 0 3px 6px rgb(194 24 91 / 0.7);
    }

    .hidden {
      display: none !important;
    }

.progress {
  margin-top: 12px;
  font-size: 14px;
  font-style: italic;
  letter-spacing: 0.03em;

  background-color: indigo;
  padding: 20px 40px;
  border-radius: 20px;
  display: inline-flex;         /* use flexbox */
  justify-content: center;      /* center horizontally */
  align-items: center;          /* center vertically */
  min-width: 80px;              /* optional: to keep bar wide enough */

  color: white;
  font-weight: 600;
  user-select: none;
}


    label {
      display: block;
      margin: 12px 0 8px;
      font-weight: 600;
      letter-spacing: 0.02em;

    /* Radio group improvements */
    .radio-group label {
      position: relative;
      display: inline-flex;
      align-items: center;     /* center radio and text vertically */
      gap: 10px;
      padding-left: 0;         /* remove left padding */
      margin-bottom: 12px;
      cursor: pointer;
      line-height: 1.4;
      font-weight: 500;
      user-select: none;
      transition: color 0.3s ease;
    }

    .radio-group input[type="radio"] {
      position: static;        /* normal flow, no absolute positioning */
      margin: 0;
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #e91e63; /* modern browsers: sets radio color */
      transition: accent-color 0.3s ease;
    }
    /* On radio label hover, change text color */
    .radio-group label:hover {
      color: #e91e63;
    }

    /* When radio checked, label text color */

      color: #e91e63;

    <script>
  function nextStep() {
    let currentStep = document.querySelector(".form-container:not(.hidden)");
    let next = currentStep.nextElementSibling;
    if (next && next.classList.contains("form-container")) {
      currentStep.classList.add("hidden");
      next.classList.remove("hidden");
    }
  }

  function prevStep() {
    let currentStep = document.querySelector(".form-container:not(.hidden)");
    let prev = currentStep.previousElementSibling;
    if (prev && prev.classList.contains("form-container")) {
      currentStep.classList.add("hidden");
      prev.classList.remove("hidden");
    }
  }
   function goToStep(stepNum) {
    document.querySelectorAll('.form-container').forEach(c => c.classList.add('hidden'));
    let target = document.getElementById('step' + stepNum);
    if(target) target.classList.remove('hidden');
  }

  // Optional: Highlight label on radio checked for better UX
  document.querySelectorAll('.radio-group input[type="radio"]').forEach(radio => {
    radio.addEventListener('change', () => {
      let group = radio.closest('.radio-group');
      group.querySelectorAll('label').forEach(label => label.style.color = '');
      if(radio.checked){
        radio.parentElement.style.color = '#e91e63';
      }
    });
  });
  
  function updateProgress(stepNum, totalSteps = 9) {
  const progressBar = document.querySelector('.progress-bar');
  if(!progressBar) return;
  const percent = (stepNum / totalSteps) * 100;
  progressBar.style.width = percent + '%';
  progressBar.textContent = `${stepNum} / ${totalSteps}`;
}

</script>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Create an Account</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

        <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #808080, #00E4FF);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: bgMove 8s infinite alternate ease-in-out;
        }
        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        .container-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
            width: 350px;
            animation: float 3s ease-in-out infinite;
            transition: transform 0.3s ease;
        }
        .container-box:hover {
            transform: scale(1.03);
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        h2 {
            text-align: center;
            color: white;
            margin-bottom: 15px;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 12px;
            position: relative;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 15px;
            transition: 0.3s ease;
            box-sizing: border-box;
        }
        .form-group input:focus {
            background: rgba(255,255,255,0.3);
            box-shadow: 0 0 10px #00E4FF, 0 0 20px #42c4d2;
        }
        .form-group i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 18px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            background: linear-gradient(45deg, #00E4FF,gray);
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease;
        }
        .btn:hover {
            background: linear-gradient(45deg, #5A3FEC, #00E4FF);
            box-shadow: 0 0 20px #00E4FF, 0 0 30px #5A3FEC;
        }
        .links {
            text-align: center;
            margin-top: 15px;
        }
        .links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }
        .links a:hover {
            color: #FFD700;
            text-shadow: 0 0 10px yellow;
        }
    </style>
    </head>
    <body>

        <!-- Signup Form -->
        <div class="container-box" id="signupForm">
            <h2><i class="bi bi-person-plus-fill"></i> Create Account</h2>
            <div class="form-group">
                <input type="text" placeholder="Full Name" name="fullname">
                <i class="bi bi-person"></i>
            </div>
            <div class="form-group">
                <input type="text" placeholder="Username" name="username">
                <i class="bi bi-person-badge"></i>
            </div>
            <div class="form-group">
                <input type="email" placeholder="Email" name="email">
                <i class="bi bi-envelope"></i>
            </div>
            <div class="form-group">
                <input type="tel" placeholder="Phone Number" name="phonenumber">
                <i class="bi bi-telephone"></i>
            </div>
            <div class="form-group">
                <input type="password" placeholder="Password" name="password">
                <i class="bi bi-lock"></i>
            </div>
            <div class="form-group">
                <input type="password" placeholder="Confirm Password"
                    name="confirmpassword">
                <i class="bi bi-shield-lock"></i>
            </div>
            <button class="btn" onclick="register()">Register</button>
            <div class="links">
                <a href="login.html">Already have an account? Login</a>
            </div>
        </div>

        <script>
        function register() {
            // Here you can add validation if needed
            window.location.href = "home.html";
        }
        // Glow effect on typing
        document.querySelectorAll('.form-group input').forEach(input => {
            input.addEventListener('input', () => {
                input.style.boxShadow = input.value ? '0 0 10px lime' : 'none';
            });
        });
    </script>

    </body>
</html>
